name: KafePin Pro 2.0 - Update Manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'KafePinPro2-Update-v*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build KafePin Pro 2.0 latest.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, hashlib, json, os, re, zipfile
          from datetime import datetime, timezone

          files=glob.glob('KafePinPro2-Update-v*.zip')
          if not files:
              print('KafePinPro2 update ZIP yok; manifest olusturulmadi.')
              raise SystemExit(0)

          def ver(p):
              m=re.search(r'-v(\d+(?:\.\d+){1,3})\.zip$', p)
              return tuple(map(int,m.group(1).split('.'))) if m else (-1,)

          z=max(files,key=ver)
          with zipfile.ZipFile(z) as f:
              if 'update.json' not in f.namelist():
                  raise SystemExit('update.json eksik')
              info=json.loads(f.read('update.json').decode('utf-8-sig'))

          if info.get('product')!='KAFEPIN_PRO_2':
              raise SystemExit('update.json product yanlis')

          version=str(info.get('version',''))
          if not re.fullmatch(r'\d+(?:\.\d+){1,3}',version):
              raise SystemExit('version gecersiz')
          if ver(z)!=tuple(map(int,version.split('.'))):
              raise SystemExit('ZIP adi ile update.json version uyusmuyor')

          h=hashlib.sha256(open(z,'rb').read()).hexdigest()
          os.makedirs('kafepinpro2',exist_ok=True)
          manifest={
            'product':'KAFEPIN_PRO_2',
            'version':version,
            'publishedAt':datetime.now(timezone.utc).isoformat(),
            'notes':str(info.get('notes') or 'KafePin Pro 2.0 guncellemesi'),
            'downloadUrl':f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/main/{z}",
            'sha256':h,
          }
          open('kafepinpro2/latest.json','w',encoding='utf-8').write(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Commit latest.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f kafepinpro2/latest.json ]; then
            git add kafepinpro2/latest.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'KafePin Pro 2.0 latest manifest'
          git push
