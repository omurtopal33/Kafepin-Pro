name: Build v3.1.57 Updater SHA Fix
on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/v3157-candidate/**'
      - '.github/workflows/build-v3157-updaterfix.yml'
permissions:
  contents: write
jobs:
  updater-field-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build deterministic v3.1.57
        shell: pwsh
        run: |
          python -m py_compile dev/v3157-candidate/build_v3157.py
          python dev/v3157-candidate/build_v3157.py
          if($LASTEXITCODE -ne 0){throw 'first build failed'}
          $h1=(Get-FileHash 'KafePin-Pro-Update-v3.1.57.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          python dev/v3157-candidate/build_v3157.py
          if($LASTEXITCODE -ne 0){throw 'second build failed'}
          $h2=(Get-FileHash 'KafePin-Pro-Update-v3.1.57.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h1 -ne $h2){throw 'deterministic SHA mismatch'}
          Write-Host "V3157_SHA=$h2"

      - name: Reproduce exact v3.1.56 stale final-pair SHA bug
        shell: pwsh
        run: |
          $old=Join-Path $env:RUNNER_TEMP 'old3156'; Expand-Archive 'KafePin-Pro-Update-v3.1.56.zip' $old -Force
          $actual=(Get-FileHash "$old/v3156-yazici-payload/yazici-pro-version.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $mgr=Get-Content "$old/KafePin_Manager_Ensure.ps1" -Raw
          $m=[regex]::Match($mgr,"Src='yazici-pro-version\.json';\s*Dst='yazici-pro-version\.json';\s*Sha='([0-9a-fA-F]{64})'")
          if(-not $m.Success){throw 'old embedded version SHA not found'}
          $embedded=$m.Groups[1].Value.ToLowerInvariant()
          if($actual -ne '641e2da9159cf7d0ba19ad212e246f2eb186907716a2c4b692a35ead29561b3c'){throw "unexpected old actual SHA $actual"}
          if($embedded -ne '8db26084ca7fb091c5be9765d3e28d2a11638447e9abfdcfc73c95319b890ff0'){throw "unexpected old embedded SHA $embedded"}
          if($actual -eq $embedded){throw 'old failure was not reproduced'}
          Write-Host 'V3156_STALE_FINAL_PAIR_SHA_REPRODUCED'

      - name: Expand and validate v3.1.57 design
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3157'; Expand-Archive 'KafePin-Pro-Update-v3.1.57.zip' $pkg -Force
          $u=Get-Content "$pkg/update.json" -Raw | ConvertFrom-Json
          if($u.version -ne '3.1.57' -or $u.channel -ne 'candidate' -or $u.stableVersion -ne '3.1.49' -or $u.baseVersion -ne '3.1.49' -or -not $u.cumulative){throw 'update policy failed'}
          $l=Get-Content 'latest.json' -Raw | ConvertFrom-Json
          if($l.version -ne '3.1.57' -or $l.stableVersion -ne '3.1.49'){throw 'latest policy failed'}
          $mgr=Get-Content "$pkg/KafePin_Manager_Ensure.ps1" -Raw
          foreach($x in @('$sourceSha = YaziciFileSha $src','$destSha = YaziciFileSha $dst','$destSha -ne $sourceSha','VerifyYaziciPayloadOnly','KAFEPIN_YAZICI_RUNTIME_SHA_VERIFY_OK')){if($mgr.IndexOf($x,[StringComparison]::Ordinal) -lt 0){throw "new manager marker missing: $x"}}
          if($mgr -match '-ne \[string\]\$pair\.Sha'){throw 'stale pair.Sha is still runtime truth'}
          $m=[regex]::Match($mgr,"Src='yazici-pro-version\.json';\s*Dst='yazici-pro-version\.json';\s*Sha='([0-9a-fA-F]{64})'")
          if(-not $m.Success){throw 'new embedded stale SHA missing; adversarial test cannot run'}
          $actual=(Get-FileHash "$pkg/v3157-yazici-payload/yazici-pro-version.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $embedded=$m.Groups[1].Value.ToLowerInvariant()
          if($actual -eq $embedded){throw 'adversarial stale-SHA precondition not met'}
          Write-Host "INTENTIONAL_STALE_EMBEDDED_SHA actual=$actual embedded=$embedded"

      - name: Run actual Manager copy verification with intentionally stale embedded SHA
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3157'
          $root=Join-Path $env:RUNNER_TEMP 'KafePin-field-install'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "$pkg/*" $root -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$root/KafePinYaziciPRO" | Out-Null
          $node=(Get-Command node.exe).Source
          $out=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root/KafePin_Manager_Ensure.ps1" -InstallRoot $root -NodePath $node -VerifyYaziciPayloadOnly 2>&1
          $code=$LASTEXITCODE
          $out | Write-Host
          if($code -ne 0){throw "actual Manager verify-only failed exit=$code"}
          if(($out -join "`n").IndexOf('KAFEPIN_YAZICI_RUNTIME_SHA_VERIFY_OK',[StringComparison]::Ordinal) -lt 0){throw 'runtime SHA success marker missing'}
          $src=(Get-FileHash "$root/v3157-yazici-payload/yazici-pro-version.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $dst=(Get-FileHash "$root/KafePinYaziciPRO/yazici-pro-version.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($src -ne $dst){throw 'source/destination version JSON SHA differs after real Manager copy'}
          Write-Host 'ACTUAL_MANAGER_STALE_SHA_FIELD_TEST_OK'

      - name: Syntax checks
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3157'
          node --check "$pkg/server.js"
          node --check "$pkg/v3157-yazici-payload/KafePin_YaziciGelir_Service.js"
          python -m py_compile "$pkg/v3157-yazici-payload/web_service.py"
          foreach($f in @("$pkg/KafePin_Manager_Ensure.ps1","$pkg/KafePin_Desktop_App_Setup.ps1","$pkg/v3157-yazici-payload/KafePin_YaziciPRO_ServiceHost.ps1")){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|%{Write-Host $_};throw "PowerShell parse failed: $f"}
          }
          $server=Get-Content "$pkg/server.js" -Raw
          if($server -notmatch 'sqlite3.OPEN_READONLY'){throw 'EveryCafe read-only lost'}

      - name: Re-test legacy Yazici desktop shortcut cleanup
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3157'
          $current=[Environment]::GetFolderPath('Desktop'); if(-not $current){$current=Join-Path $env:USERPROFILE 'Desktop'}
          $public=Join-Path $env:PUBLIC 'Desktop'
          $fake='C:\Users\KafePinFieldTest3157'; $fakeDesk=Join-Path $fake 'Desktop'; $fakeOne=Join-Path $fake 'OneDrive\Desktop'
          New-Item -ItemType Directory -Force -Path $current,$public,$fakeDesk,$fakeOne | Out-Null
          $targets=@((Join-Path $current 'KafePin Yazıcı PRO.lnk'),(Join-Path $current 'KafePin Yazici PRO.lnk'),(Join-Path $public 'KafePin Yazıcı PRO.lnk'),(Join-Path $fakeDesk 'KafePin Yazici PRO.lnk'),(Join-Path $fakeOne 'KafePin Yazıcı PRO.lnk'))
          foreach($p in $targets){Set-Content -LiteralPath $p -Value 'legacy-field-shortcut' -Encoding ASCII}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pkg/KafePin_Desktop_App_Setup.ps1" -InstallRoot $pkg -CleanupLegacyYaziciOnly
          if($LASTEXITCODE -ne 0){throw 'shortcut cleanup failed'}
          foreach($p in $targets){if(Test-Path -LiteralPath $p){throw "legacy shortcut survived: $p"}}
          Remove-Item -LiteralPath $fake -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'LEGACY_SHORTCUT_3157_OK'

      - name: Re-test hidden 17891 plus 17893 service startup
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3157'
          $root=Join-Path $env:RUNNER_TEMP 'KafePinYaziciPRO-3157'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "$pkg/v3157-yazici-payload/KafePin_YaziciPRO_ServiceHost.ps1" "$root/KafePin_YaziciPRO_ServiceHost.ps1"
          @'
          const http=require('http');
          const s=http.createServer((q,r)=>{r.setHeader('Content-Type','application/json');if(q.url.startsWith('/health'))r.end(JSON.stringify({ok:true,version:'3.1.56-candidate1'}));else{r.statusCode=404;r.end('{}')}});s.listen(17893,'127.0.0.1');
          '@ | Set-Content "$root/KafePin_YaziciGelir_Service.js" -Encoding UTF8
          @'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith('/api/health'):
                      b=json.dumps({'ok':True,'version':'3.1.56-candidate1'}).encode();self.send_response(200);self.send_header('Content-Type','application/json');self.send_header('X-KafePin-Yazici-Isolation','separate-loopback-service');self.end_headers();self.wfile.write(b)
                  else:self.send_response(404);self.end_headers()
              def log_message(self,*a):pass
          HTTPServer(('127.0.0.1',17891),H).serve_forever()
          '@ | Set-Content "$root/web_service.py" -Encoding UTF8
          $node=(Get-Command node.exe).Source;$py=(Get-Command python.exe).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "$root/KafePin_YaziciPRO_ServiceHost.ps1" -InstallRoot $root -NodePath $node -PythonPath $py -SkipRepair
          if($LASTEXITCODE -ne 0){throw 'dual hidden service host failed'}
          $w=Invoke-RestMethod 'http://127.0.0.1:17891/api/health' -TimeoutSec 2;$r=Invoke-RestMethod 'http://127.0.0.1:17893/health' -TimeoutSec 2
          if(-not $w.ok -or -not $r.ok){throw 'health failed'}
          $st=Get-Content "$env:ProgramData/KafePinPro/logs/v3156-yazici-startup.json" -Raw | ConvertFrom-Json
          foreach($pidValue in @([int]$st.nodePid,[int]$st.pythonPid)){ $p=Get-Process -Id $pidValue -ErrorAction Stop;if($p.MainWindowHandle -ne 0){throw "visible service pid=$pidValue"} }
          foreach($pidValue in @([int]$st.nodePid,[int]$st.pythonPid)){Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue}
          Write-Host 'DUAL_SERVICE_HIDDEN_3157_OK'

      - name: Compile main KafePin desktop shell
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3157';$root=Join-Path $env:RUNNER_TEMP 'kp-desktop-3157'
          New-Item -ItemType Directory -Force -Path "$root/desktop-app" | Out-Null
          Copy-Item "$pkg/desktop-app/KafePinProDesktop.cs" "$root/desktop-app/KafePinProDesktop.cs"
          Copy-Item "$pkg/desktop-app/KafePin.ico" "$root/desktop-app/KafePin.ico"
          Copy-Item "$pkg/KafePin_Desktop_App_Setup.ps1" "$root/KafePin_Desktop_App_Setup.ps1"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root/KafePin_Desktop_App_Setup.ps1" -InstallRoot $root -AppVersion '1.1.5'
          if($LASTEXITCODE -ne 0 -or -not (Test-Path "$root/desktop-app/KafePin Pro.exe")){throw 'desktop compile failed'}
          Write-Host 'DESKTOP_3157_COMPILE_OK'

      - name: Validate ZIP manifest
        shell: pwsh
        run: |
          @'
          import json,zipfile
          from pathlib import Path
          p=Path('KafePin-Pro-Update-v3.1.57.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              u=json.loads(z.read('update.json').decode('utf-8-sig'))
              assert set(z.namelist())==set(u['files'])
              assert 'v3157-yazici-payload/yazici-pro-version.json' in z.namelist()
          print('ZIP_MANIFEST_3157_OK')
          '@ | Set-Content 'dev/v3157-candidate/check_zip.py' -Encoding UTF8
          python dev/v3157-candidate/check_zip.py

      - name: Finalize test report and publish candidate outputs
        shell: pwsh
        run: |
          $sha=(Get-FileHash 'KafePin-Pro-Update-v3.1.57.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          # KafePin Pro v3.1.57 ADAY — Updater SHA Kesin Düzeltme

          - STABLE: **3.1.49**
          - Aday: **3.1.57**
          - Windows test sonucu: **BAŞARILI**.
          - v3.1.56 hata birebir üretildi: gerçek `yazici-pro-version.json` SHA `641e2da...`, Manager gömülü SHA `8db26084...` ve değerler farklı (`V3156_STALE_FINAL_PAIR_SHA_REPRODUCED`).
          - Kök neden: eski builder regex'i son `$pairs` elemanında virgül olmadığı için son SHA'yı yenilemiyordu.
          - v3.1.57 gerçek Manager testi: gömülü SHA bilerek yanlış olmasına rağmen doğrulanmış paket kaynağı → hedef SHA256 karşılaştırmasıyla **BAŞARILI** (`ACTUAL_MANAGER_STALE_SHA_FIELD_TEST_OK`).
          - Eski masaüstü Yazıcı PRO kısayol temizliği: **BAŞARILI**.
          - 17891 + 17893 gizli süreç başlatma: **BAŞARILI**.
          - Ana KafePin desktop EXE derleme: **BAŞARILI**.
          - ZIP manifest/bütünlük: **BAŞARILI**.
          - EveryCafe salt-okunur kuralı korundu.
          - `stableVersion`: **3.1.49**.
          - Paket SHA256: `$sha`
          "@ | Set-Content 'V3.1.57-CANDIDATE-TEST-REPORT.md' -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'KafePin-Pro-Update-v3.1.57.zip' 'KafePin-Pro-Update-v3.1.57.sha256.txt' 'V3.1.57-CANDIDATE-TEST-REPORT.md' 'latest.json'
          foreach($p in @('KafePin-Pro-Update-v3.1.56.zip','KafePin-Pro-Update-v3.1.56.sha256.txt','V3.1.56-CANDIDATE-TEST-REPORT.md')){if(Test-Path $p){git rm -f -- $p}}
          if(git diff --cached --quiet){exit 0}
          git commit -m 'release: publish field-tested v3.1.57 updater fix [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
