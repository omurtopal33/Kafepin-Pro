name: Validate v3.1.52 Candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-candidate:
    if: startsWith(github.head_ref, 'candidate/v3.1.52-') || startsWith(github.ref_name, 'candidate/v3.1.52-')
    runs-on: windows-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Detect already committed candidate
        shell: powershell
        run: |
          if (Test-Path 'KafePin-Pro-Update-v3.1.52.zip') {
            'CANDIDATE_ALREADY_COMMITTED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            'CANDIDATE_ALREADY_COMMITTED=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and expand v3.1.52 sources
        shell: powershell
        run: |
          $srcRoot = 'dev/v3152-candidate'
          $dst = Join-Path $srcRoot 'src'
          $zip = Join-Path $srcRoot 'source-bundle.rebuilt.zip'
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $parts = Get-ChildItem -LiteralPath $srcRoot -Filter 'source-bundle.b64.part*' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 source chunks, got $($parts.Count)" }
          $b64 = (($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName).Trim() }) -join '')
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($sha -ne '494d58263dcf5087e78385a774ab4c7822f8995e8af47d3aa10ddb0a638ff160') { throw "Source bundle SHA mismatch: $sha" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force
          Get-ChildItem -LiteralPath $dst -File | Copy-Item -Destination $srcRoot -Force
      - name: Build and run full candidate tests
        shell: powershell
        run: python dev/v3152-candidate/src/build_v3152.py
      - name: Create candidate SHA and feed
        shell: powershell
        run: |
          $sha=(Get-FileHash -Algorithm SHA256 'KafePin-Pro-Update-v3.1.52.zip').Hash.ToLowerInvariant()
          "$sha  KafePin-Pro-Update-v3.1.52.zip" | Set-Content -Encoding ASCII 'KafePin-Pro-Update-v3.1.52.sha256.txt'
          $feed=[ordered]@{
            version='3.1.52'; channel='candidate'; stableVersion='3.1.49'; baseVersion='3.1.49'; cumulative=$false;
            downloadUrl='https://raw.githubusercontent.com/omurtopal33/Kafepin-Pro/main/KafePin-Pro-Update-v3.1.52.zip';
            sha256=$sha;
            notes='v3.1.52 ADAY: Yazıcı PRO onaylı gelir + Fotokopi + Tarama/WhatsApp + Belge/Dilekçe hazırlama; v3.1.51 Telegram düzeltmeleri korunur.'
          }
          $feed | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 'latest-candidate.json'
      - name: Verify candidate files
        shell: powershell
        run: |
          if (-not (Test-Path 'KafePin-Pro-Update-v3.1.52.zip')) { throw 'ZIP missing' }
          if (-not (Test-Path 'V3.1.52-CANDIDATE-TEST-REPORT.md')) { throw 'Report missing' }
          $r=Get-Content 'V3.1.52-CANDIDATE-TEST-REPORT.md' -Raw
          foreach($m in @('onaydan önce gitmedi','duplicate confirm','Belge/Dilekçe','WhatsApp Web','MP3 PRO')) { if($r.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "report marker missing: $m"} }
      - name: Upload tested candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafepin-v3.1.52-candidate
          path: |
            KafePin-Pro-Update-v3.1.52.zip
            KafePin-Pro-Update-v3.1.52.sha256.txt
            V3.1.52-CANDIDATE-TEST-REPORT.md
            latest-candidate.json
          retention-days: 7
      - name: Commit first tested candidate to candidate branch
        if: env.CANDIDATE_ALREADY_COMMITTED != 'true'
        shell: bash
        run: |
          git config user.name 'KafePin Candidate Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add KafePin-Pro-Update-v3.1.52.zip KafePin-Pro-Update-v3.1.52.sha256.txt V3.1.52-CANDIDATE-TEST-REPORT.md latest-candidate.json
          git commit -m 'candidate: publish Windows-tested KafePin Pro v3.1.52'
          git push origin HEAD:candidate/v3.1.52-full
