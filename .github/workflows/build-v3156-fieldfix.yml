name: Build v3.1.56 Field Fix
on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/v3156-candidate/**'
      - '.github/workflows/build-v3156-fieldfix.yml'
permissions:
  contents: write
jobs:
  field-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build deterministic candidate
        shell: pwsh
        run: |
          python -m py_compile dev/v3156-candidate/build_v3156.py
          python dev/v3156-candidate/build_v3156.py
          if($LASTEXITCODE -ne 0){throw 'First v3.1.56 build failed'}
          $h1=(Get-FileHash 'KafePin-Pro-Update-v3.1.56.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          python dev/v3156-candidate/build_v3156.py
          if($LASTEXITCODE -ne 0){throw 'Second v3.1.56 build failed'}
          $h2=(Get-FileHash 'KafePin-Pro-Update-v3.1.56.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h1 -ne $h2){throw 'Deterministic rebuild SHA mismatch'}
          Write-Host "V3156_SHA=$h2"

      - name: Expand and static validate
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3156'; Expand-Archive 'KafePin-Pro-Update-v3.1.56.zip' $pkg -Force
          $u=Get-Content "$pkg/update.json" -Raw | ConvertFrom-Json
          if($u.version -ne '3.1.56' -or $u.channel -ne 'candidate' -or $u.stableVersion -ne '3.1.49' -or $u.baseVersion -ne '3.1.49' -or -not $u.cumulative){throw 'update policy failed'}
          $l=Get-Content 'latest.json' -Raw | ConvertFrom-Json
          if($l.version -ne '3.1.56' -or $l.stableVersion -ne '3.1.49'){throw 'latest policy failed'}
          $mgr=Get-Content "$pkg/KafePin_Manager_Ensure.ps1" -Raw
          foreach($m in @('v3156-yazici-payload','KafePin_YaziciPRO_ServiceHost.ps1','AppVersion ''1.1.5''')){if($mgr -notmatch [regex]::Escape($m)){throw "manager marker missing: $m"}}
          if($mgr -match 'CreateShortcut\('){throw 'legacy Yazici shortcut creation exists'}
          if($mgr -match 'Wait-YaziciWeb|Wait-YaziciRevenue|Stop-YaziciRuntime'){throw 'updater timeout regression'}
          $setup=Get-Content "$pkg/KafePin_Desktop_App_Setup.ps1" -Raw
          foreach($m in @('Remove-LegacyYaziciProShortcuts','CleanupLegacyYaziciOnly','KafePin Yazıcı PRO.lnk','KafePin Yazici PRO.lnk')){if($setup -notmatch [regex]::Escape($m)){throw "shortcut cleanup marker missing: $m"}}
          $cs=Get-Content "$pkg/desktop-app/KafePinProDesktop.cs" -Raw
          foreach($m in @('KafePin_YaziciPRO_ServiceHost.ps1','3.1.56-candidate1','17893/health','v3156-yazici-startup.log')){if($cs -notmatch [regex]::Escape($m)){throw "desktop marker missing: $m"}}
          $hostText=Get-Content "$pkg/v3156-yazici-payload/KafePin_YaziciPRO_ServiceHost.ps1" -Raw
          foreach($m in @('Start-Both','WindowStyle Hidden','17891/api/health','17893/health','Repair-Python')){if($hostText -notmatch [regex]::Escape($m)){throw "host marker missing: $m"}}
          $server=Get-Content "$pkg/server.js" -Raw
          if($server -notmatch 'sqlite3.OPEN_READONLY'){throw 'EveryCafe read-only lost'}
          if($server -notmatch 'KAFEPIN_DESKTOP_APP_VERSION = "1.1.5"'){throw 'desktop target 1.1.5 missing'}

      - name: Syntax checks
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3156'
          node --check "$pkg/server.js"
          node --check "$pkg/v3156-yazici-payload/KafePin_YaziciGelir_Service.js"
          python -m py_compile "$pkg/v3156-yazici-payload/web_service.py"
          foreach($f in @("$pkg/KafePin_Manager_Ensure.ps1","$pkg/KafePin_Desktop_App_Setup.ps1","$pkg/v3156-yazici-payload/KafePin_YaziciPRO_ServiceHost.ps1")){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|%{Write-Host $_};throw "PowerShell parse failed: $f"}
          }

      - name: Reproduce and remove legacy desktop shortcuts
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3156'
          $current=[Environment]::GetFolderPath('Desktop'); if(-not $current){$current=Join-Path $env:USERPROFILE 'Desktop'}
          $public=Join-Path $env:PUBLIC 'Desktop'
          $fake='C:\Users\KafePinFieldTest'; $fakeDesk=Join-Path $fake 'Desktop'; $fakeOne=Join-Path $fake 'OneDrive\Desktop'
          New-Item -ItemType Directory -Force -Path $current,$public,$fakeDesk,$fakeOne | Out-Null
          $targets=@((Join-Path $current 'KafePin Yazıcı PRO.lnk'),(Join-Path $current 'KafePin Yazici PRO.lnk'),(Join-Path $public 'KafePin Yazıcı PRO.lnk'),(Join-Path $fakeDesk 'KafePin Yazici PRO.lnk'),(Join-Path $fakeOne 'KafePin Yazıcı PRO.lnk'))
          foreach($p in $targets){Set-Content -LiteralPath $p -Value 'legacy-field-shortcut' -Encoding ASCII}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pkg/KafePin_Desktop_App_Setup.ps1" -InstallRoot $pkg -CleanupLegacyYaziciOnly
          if($LASTEXITCODE -ne 0){throw 'shortcut cleanup command failed'}
          foreach($p in $targets){if(Test-Path -LiteralPath $p){throw "legacy shortcut survived: $p"}}
          Remove-Item -LiteralPath $fake -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'LEGACY_SHORTCUT_FIELD_TEST_OK'

      - name: Real hidden 17891 plus 17893 startup test
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3156'
          $root=Join-Path $env:RUNNER_TEMP 'KafePinYaziciPRO-field'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "$pkg/v3156-yazici-payload/KafePin_YaziciPRO_ServiceHost.ps1" "$root/KafePin_YaziciPRO_ServiceHost.ps1"
          @'
          const http=require('http');
          const s=http.createServer((q,r)=>{r.setHeader('Content-Type','application/json'); if(q.url.startsWith('/health')){r.end(JSON.stringify({ok:true,version:'3.1.56-candidate1'}));}else{r.statusCode=404;r.end('{}');}});
          s.listen(17893,'127.0.0.1');
          '@ | Set-Content "$root/KafePin_YaziciGelir_Service.js" -Encoding UTF8
          @'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith('/api/health'):
                      b=json.dumps({'ok':True,'version':'3.1.56-candidate1'}).encode(); self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('X-KafePin-Yazici-Isolation','separate-loopback-service'); self.end_headers(); self.wfile.write(b)
                  else: self.send_response(404); self.end_headers()
              def log_message(self,*a): pass
          HTTPServer(('127.0.0.1',17891),H).serve_forever()
          '@ | Set-Content "$root/web_service.py" -Encoding UTF8
          $node=(Get-Command node.exe).Source; $py=(Get-Command python.exe).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "$root/KafePin_YaziciPRO_ServiceHost.ps1" -InstallRoot $root -NodePath $node -PythonPath $py -SkipRepair
          if($LASTEXITCODE -ne 0){throw 'real dual service host failed'}
          $w=Invoke-RestMethod 'http://127.0.0.1:17891/api/health' -TimeoutSec 2
          $r=Invoke-RestMethod 'http://127.0.0.1:17893/health' -TimeoutSec 2
          if(-not $w.ok -or $w.version -ne '3.1.56-candidate1' -or -not $r.ok -or $r.version -ne '3.1.56-candidate1'){throw 'health/version mismatch'}
          $st=Get-Content "$env:ProgramData/KafePinPro/logs/v3156-yazici-startup.json" -Raw | ConvertFrom-Json
          foreach($pidValue in @([int]$st.nodePid,[int]$st.pythonPid)){ $p=Get-Process -Id $pidValue -ErrorAction Stop; if($p.MainWindowHandle -ne 0){throw "service has visible window pid=$pidValue"} }
          foreach($pidValue in @([int]$st.nodePid,[int]$st.pythonPid)){Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue}
          Write-Host 'DUAL_SERVICE_HIDDEN_FIELD_TEST_OK'

      - name: Compile main KafePin desktop shell
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'v3156'; $root=Join-Path $env:RUNNER_TEMP 'kp-desktop-3156'
          New-Item -ItemType Directory -Force -Path "$root/desktop-app" | Out-Null
          Copy-Item "$pkg/desktop-app/KafePinProDesktop.cs" "$root/desktop-app/KafePinProDesktop.cs"
          Copy-Item "$pkg/desktop-app/KafePin.ico" "$root/desktop-app/KafePin.ico"
          Copy-Item "$pkg/KafePin_Desktop_App_Setup.ps1" "$root/KafePin_Desktop_App_Setup.ps1"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root/KafePin_Desktop_App_Setup.ps1" -InstallRoot $root -AppVersion '1.1.5'
          if($LASTEXITCODE -ne 0){throw 'Desktop setup/compile failed'}
          if(-not (Test-Path "$root/desktop-app/KafePin Pro.exe")){throw 'Desktop EXE not produced'}
          Write-Host 'DESKTOP_3156_COMPILE_OK'

      - name: Validate package manifest and ZIP
        shell: pwsh
        run: |
          @'
          import json,zipfile
          from pathlib import Path
          p=Path('KafePin-Pro-Update-v3.1.56.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              u=json.loads(z.read('update.json').decode('utf-8-sig'))
              assert set(z.namelist())==set(u['files'])
              assert 'v3156-yazici-payload/KafePin_YaziciPRO_ServiceHost.ps1' in z.namelist()
          print('ZIP_MANIFEST_3156_OK')
          '@ | Set-Content 'dev/v3156-candidate/check_zip.py' -Encoding UTF8
          python dev/v3156-candidate/check_zip.py

      - name: Publish tested outputs to candidate branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'KafePin-Pro-Update-v3.1.56.zip' 'KafePin-Pro-Update-v3.1.56.sha256.txt' 'V3.1.56-CANDIDATE-TEST-REPORT.md' 'latest.json'
          foreach($p in @('KafePin-Pro-Update-v3.1.55.zip','KafePin-Pro-Update-v3.1.55.sha256.txt','V3.1.55-CANDIDATE-TEST-REPORT.md')){if(Test-Path $p){git rm -f -- $p}}
          if(git diff --cached --quiet){exit 0}
          git commit -m 'release: publish field-tested v3.1.56 candidate [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
