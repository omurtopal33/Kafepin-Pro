name: KafePin Pro v3.1.26 cumulative publish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v326-cumulative.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: v3.1.21 STABLE tabanini al
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/base.zip 'https://raw.githubusercontent.com/omurtopal33/Kafepin-Pro/main/KafePin-Pro-Update-v3.1.21.zip'
          rm -rf build && mkdir build
          unzip -q /tmp/base.zip -d build
      - name: v3.1.22-3.1.26 kümülatif yamalari uygula
        run: |
          set -euo pipefail
          echo '💾⚠️' | base64 -d > /tmp/server.js.patch
          (cd build && patch -p1 < /tmp/server.js.patch)
          echo '-radius:8px;padding:10px;color:#e9f3ff}.admin-notification-item.critical{border-color:#8b2a3a;background:#2b1118}.admin-notification-item.warning{border-color:#8a6819;background:#281f0c}.admin-notification-item .title{font-weight:800;margin-bottom:4px}.admin-notification-item .detail{font-size:11px;color:#b9c9dd;line-height:1.45}.admin-notification-item .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}.admin-notification-item .actions button{padding:5px 9px;font-size:10px;border-radius:6px}.admin-notification-empty{color:#8fe0ad;font-size:12px;padding:8px;border:1px dashed #2f6046;border-radius:8px;background:#0e2118}
