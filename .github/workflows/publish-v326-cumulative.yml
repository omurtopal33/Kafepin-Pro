name: KafePin Pro v3.1.26 publish
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Build verify publish
        run: bash .github/v326/publish.sh
