name: KafePin Pro v3.1.28 publish
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Build verify publish
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/v327.zip 'https://raw.githubusercontent.com/omurtopal33/Kafepin-Pro/main/KafePin-Pro-Update-v3.1.27.zip'
          rm -rf build && mkdir build
          unzip -q /tmp/v327.zip -d build
          (cd build && patch -p1 < ../.github/v328/server.patch)
          (cd build && patch -p1 < ../.github/v328/desktop.patch)
          (cd build && patch -p1 < ../.github/v328/management.patch)
          cp .github/v328/kafepin-pro-version.json build/kafepin-pro-version.json
          cp .github/v328/update.json build/update.json
          checks=(
          '7ace1c9fd4bb009861bf3b96a0cfe0e38ccb4fad199c2004f369dda0f6ecfed1  build/server.js'
          'a80fa4e716cb517e60600fed3541dcaca17e9498040ffd7a7bb350317c74b75d  build/KafePin_System_Manager.ps1'
          'b53fbbb055ec8427f5b61e0e466c76325a067f6c72017416319347982df1136c  build/KafePin_Manager_Ensure.ps1'
          '9796e60831c56e388cbc61e8bfc4fa7354c2affb86e8b72823c51c7701534b00  build/KafePin_Desktop_Action.ps1'
          '2191e0098f331eba7550ac8e47c55402f9c45d33fa9cf258b607036fbc0b2758  build/KafePin_Desktop_Helper_Ensure.ps1'
          '0923235b8e2570461ac9a57798ae7bfaf27f69b380834180cf46855cd2f77a9f  build/public/admin.html'
          'bb0dfc5c6303478a5ab3949f67fd357f48d1a47c4d0a565e7f100aef516e7c12  build/public/kafepin-pro-yonetim.html'
          '9bed2c91dd00465594cba188f90e1e2c51ee0f4d9f6757b80b3b4cba1b310af2  build/kafepin-pro-version.json'
          '28b02c7c20213983b306a9f482dfe54c6b5d8eaa044a5907fee7e827869dfb9a  build/update.json'
          )
          printf '%s\n' "${checks[@]}" | sha256sum -c -
          node --check build/server.js
          python3 - <<'PY'
          import re,pathlib,subprocess,json
          for p in [pathlib.Path('build/public/admin.html'),pathlib.Path('build/public/kafepin-pro-yonetim.html')]:
              for i,x in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',p.read_text(encoding='utf-8'),re.S|re.I)):
                  q=pathlib.Path('/tmp')/(p.stem+f'_{i}.js'); q.write_text(x,encoding='utf-8')
                  subprocess.run(['node','--check',str(q)],check=True)
          server=pathlib.Path('build/server.js').read_text(encoding='utf-8')
          action=pathlib.Path('build/KafePin_Desktop_Action.ps1').read_text(encoding='utf-8-sig')
          helper=pathlib.Path('build/KafePin_Desktop_Helper_Ensure.ps1').read_text(encoding='utf-8-sig')
          assert 'selectLocalUpdateZipWindows' in server
          assert 'action: "select-update-zip"' in server
          assert 'System.Windows.Forms.OpenFileDialog' not in server
          assert "if ($actionName -eq 'select-update-zip')" in action
          assert '{374DE290-123F-4565-9164-39C4925E467B}' in action
          assert '$dialog.InitialDirectory = $downloads' in action
          assert 'TASK_LOGON_INTERACTIVE_TOKEN' in helper
          assert json.load(open('build/update.json',encoding='utf-8'))['version']=='3.1.28'
          print('ZIP_PICKER_STATIC_OK')
          PY
          rm -f KafePin-Pro-Update-v3.1.28.zip
          (cd build && zip -q -r ../KafePin-Pro-Update-v3.1.28.zip server.js KafePin_System_Manager.ps1 KafePin_Manager_Ensure.ps1 KafePin_Desktop_Action.ps1 KafePin_Desktop_Helper_Ensure.ps1 public/admin.html public/kafepin-pro-yonetim.html kafepin-pro-version.json update.json)
          test "$(unzip -Z1 KafePin-Pro-Update-v3.1.28.zip | wc -l)" -eq 9
          unzip -t KafePin-Pro-Update-v3.1.28.zip
          ZIP_SHA="$(sha256sum KafePin-Pro-Update-v3.1.28.zip | awk '{print $1}')"
          export ZIP_SHA
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone,timedelta
          u=json.load(open('build/update.json',encoding='utf-8'))
          out={'version':'3.1.28','publishedAt':datetime.now(timezone(timedelta(hours=3))).isoformat(timespec='seconds'),'notes':u['notes'],'downloadUrl':'https://raw.githubusercontent.com/omurtopal33/Kafepin-Pro/main/KafePin-Pro-Update-v3.1.28.zip','sha256':os.environ['ZIP_SHA']}
          with open('latest.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2); f.write('\n')
          print('GITHUB_ZIP_SHA256='+os.environ['ZIP_SHA'])
          PY
          rm -rf build .github/v328 .github/workflows/publish-v328.yml
          git config user.name 'KafePin Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A KafePin-Pro-Update-v3.1.28.zip latest.json .github/v328 .github/workflows/publish-v328.yml
          git commit -m 'KafePin: v3.1.28 cumulative publish'
          git push origin HEAD:v328-publish
