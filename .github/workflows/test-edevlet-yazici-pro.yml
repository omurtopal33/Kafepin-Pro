name: TEST e-Devlet Yazici PRO Feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-edevlet-yazici-pro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Expand current v4.0.2 STABLE package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip='KafePin-Pro-Update-v4.0.2.zip'
          if(-not (Test-Path $zip)){ throw 'v4.0.2 stable package missing' }
          $dst=Join-Path $env:RUNNER_TEMP 'kp-edevlet-probe'
          if(Test-Path $dst){ Remove-Item $dst -Recurse -Force }
          Expand-Archive $zip $dst -Force
          "KP_PROBE_ROOT=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate existing Yazici PRO WebView2 host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=Get-ChildItem $env:KP_PROBE_ROOT -Recurse -File -Filter 'KafePin_YaziciPRO_WebView2.ps1'
          if($files.Count -ne 1){ throw "Expected exactly one Yazici PRO WebView2 host, found $($files.Count)" }
          $f=$files[0].FullName
          "KP_WEBVIEW_FILE=$f" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "WEBVIEW_FILE=$f"

      - name: Verify same-window WebView2 hooks are available
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $s=Get-Content $env:KP_WEBVIEW_FILE -Raw -Encoding UTF8
          foreach($must in @('EnsureCoreWebView2Async','CoreWebView2','web.whatsapp.com')){
            if(-not $s.Contains($must)){ throw "Missing WebView2 marker: $must" }
          }
          $markers=@('NewWindowRequested','NavigationStarting','NavigationCompleted','WebMessageReceived','Navigate','Source')
          foreach($m in $markers){
            if($s.Contains($m)){ Write-Host "HOOK_PRESENT=$m" } else { Write-Host "HOOK_ABSENT=$m" }
          }
          Write-Host 'WEBVIEW2_EXISTING_HOST_OK'

      - name: Probe official e-Devlet service entry points
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          $urls=@(
            'https://www.turkiye.gov.tr/nvi-yerlesim-yeri-ve-diger-adres-belgesi-sorgulama',
            'https://www.turkiye.gov.tr/adli-sicil-kaydi',
            'https://www.turkiye.gov.tr/sgk-tescil-ve-hizmet-dokumu'
          )
          foreach($u in $urls){
            try {
              $r=Invoke-WebRequest -UseBasicParsing -Uri $u -MaximumRedirection 10 -TimeoutSec 30
              if($r.StatusCode -lt 200 -or $r.StatusCode -ge 400){ throw "HTTP $($r.StatusCode)" }
              Write-Host "SERVICE_OK=$u FINAL=$($r.BaseResponse.ResponseUri.AbsoluteUri)"
            } catch {
              throw "e-Devlet service probe failed for $u :: $($_.Exception.Message)"
            }
          }

      - name: Validate proposed session pricing state machine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $session=[ordered]@{ serviceCharged=$false; serviceCount=0; printedPages=0; copies=0 }
          function Add-Print([int]$pages,[int]$copies){
            if(-not $session.serviceCharged){$session.serviceCharged=$true;$session.serviceCount++}
            $session.printedPages += ($pages*$copies)
            $session.copies += $copies
          }
          Add-Print 1 3
          Add-Print 2 1
          Add-Print 1 2
          if($session.serviceCount -ne 1){throw 'Service fee would be charged more than once'}
          if($session.printedPages -ne 7){throw "Printed page accounting wrong: $($session.printedPages)"}
          Write-Host "SESSION_PRICE_OK service=$($session.serviceCount) pages=$($session.printedPages) copies=$($session.copies)"

      - name: Safety lock - no STABLE mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (git diff --quiet)){ throw 'Probe modified tracked repository files' }
          Write-Host 'STABLE_UNCHANGED_OK'
