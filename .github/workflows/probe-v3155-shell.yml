name: Probe v3.1.55 Desktop Shell
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-v3155-shell.yml'
      - 'dev/v3155-candidate/**'
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Inspect historical update packages
        shell: pwsh
        run: |
          @('KafePin-Pro-Update-v3.1.49.zip','KafePin-Pro-Update-v3.1.29.zip','KafePin-Pro-Update-v3.1.54.zip') | ForEach-Object {
            Write-Host "=== $_ ==="
            if(-not (Test-Path $_)){ Write-Host 'MISSING'; return }
            $tmp=Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($_)); if(Test-Path $tmp){Remove-Item $tmp -Recurse -Force}; Expand-Archive $_ $tmp
            Get-ChildItem $tmp -Recurse -File | Where-Object { $_.Name -match 'Desktop|Setup|index|server|Yazici|Yazıcı' } | ForEach-Object { Write-Host ($_.FullName.Substring($tmp.Length+1)) }
            $desktop=Get-ChildItem $tmp -Recurse -File | Where-Object { $_.Name -eq 'KafePin_Desktop_App_Setup.ps1' } | Select-Object -First 1
            if($desktop){ Write-Host '--- DESKTOP SETUP START ---'; Get-Content $desktop.FullName -Raw -Encoding UTF8; Write-Host '--- DESKTOP SETUP END ---' }
            $pub=Get-ChildItem $tmp -Recurse -File | Where-Object { $_.FullName -match '[\\/]public[\\/]index\.html$' } | Select-Object -First 1
            if($pub){ Write-Host '--- PUBLIC INDEX YAZICI LINES ---'; Select-String -Path $pub.FullName -Pattern 'Yazıcı|Yazici|17891|printer' -Context 3,3 | ForEach-Object { $_.ToString() } }
          }
