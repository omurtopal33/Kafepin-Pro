name: Probe v3.1.55 Desktop Shell
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-v3155-shell.yml'
      - 'dev/v3155-candidate/**'
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Inspect historical update packages
        shell: pwsh
        run: |
          $tmp=Join-Path $env:RUNNER_TEMP 'kp149'; if(Test-Path $tmp){Remove-Item $tmp -Recurse -Force}; Expand-Archive 'KafePin-Pro-Update-v3.1.49.zip' $tmp
          Write-Host '--- DESKTOP CSHARP YAZICI/WEBVIEW LINES ---'
          $cs=Join-Path $tmp 'desktop-app\KafePinProDesktop.cs'
          Select-String -Path $cs -Pattern 'Yazıcı|Yazici|17891|WebView|TabPage|WhatsApp|Navigate|Source|Process.Start' -Context 8,12 | ForEach-Object { $_.ToString() }
          Write-Host '--- DESKTOP SETUP VERSION/LAUNCH ---'
          $ps=Join-Path $tmp 'KafePin_Desktop_App_Setup.ps1'
          Select-String -Path $ps -Pattern 'AppVersion|SourceFile|Start-Process|New-KafePinShortcut' -Context 2,4 | ForEach-Object { $_.ToString() }
