      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,zipfile,json,py_compile,tempfile,pathlib
          z=zipfile.ZipFile('KafePin-Pro-Update-v3.1.50.zip')
          u=json.loads(z.read('update.json').decode('utf-8-sig'))
          assert u['version']=='3.1.50' and u['channel']=='test'
          yz=zipfile.ZipFile(io.BytesIO(z.read('pro-components/yazici-pro.zip')))
          names=set(yz.namelist())
          for n in ['web_service.py','revenue.py','web/app.js','config.py','print_image.ps1','yazici-pro-version.json']:
              assert n in names,n
          tmp=pathlib.Path(tempfile.mkdtemp())
          for n in ['web_service.py','revenue.py','config.py','pdf_engine.py']:
              p=tmp/pathlib.Path(n).name;p.write_bytes(yz.read(n));py_compile.compile(str(p),doraise=True)
          js=yz.read('web/app.js').decode('utf-8-sig')
          for s in ['WHATSAPP / HIZLI ÇIKTI','SON YAZDIRMALAR','YAZICI GELİRİ','Ücretsiz yazdır']:
              assert s in js,s
          print('STATIC_OK')
          PY

      - name: Commit TEST package to TEST branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KafePin Test Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- KafePin-Pro-Update-v3.1.50.zip KafePin-Pro-Update-v3.1.50.sha256.txt latest-test.branch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: package v3.1.50 Yazici PRO revenue'
          git push origin HEAD:test/v3.1.50-yazici-gelir
