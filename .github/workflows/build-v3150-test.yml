          latest={'channel':'test','stableVersion':'3.1.49','version':'3.1.50','available':True,'baseVersion':'3.1.29','cumulative':True,'notes':ud['notes'],'downloadUrl':'https://raw.githubusercontent.com/omurtopal33/Kafepin-Pro/test/v3.1.50-yazici-gelir/KafePin-Pro-Update-v3.1.50.zip','sha256':sha}
