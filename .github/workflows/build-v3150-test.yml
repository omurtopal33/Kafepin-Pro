          # nested zip yeniden olustur
          with zipfile.ZipFile(nested,'w',zipfile.ZIP_DEFLATED) as z:
              for f in yaz.rglob('*'):
                  if f.is_file(): z.write(f,f.relative_to(yaz).as_posix())

          # Mevcut kafede kurulu Yazici PRO'yu update sonrasinda yukselt.
          dp=root/'KafePin_Desktop_App_Setup.ps1'; dt=dp.read_text(encoding='utf-8-sig')
          marker="  # Yeni kafe kurulumunda v3.1.49 ile gelen bağımsız PRO bileşenleri yalnız\n"
          upgrade=r'''  # v3.1.50 TEST: mevcut kurulu Yazici PRO varsa yeni bileşen ZIP'i ile yükselt.
  $printerTarget = Join-Path $InstallRoot 'KafePinYaziciPRO'
  $printerZip = Join-Path $InstallRoot 'pro-components\yazici-pro.zip'
  if ((Test-Path -LiteralPath $printerTarget) -and (Test-Path -LiteralPath $printerZip)) {
    try {
      Write-KafePinLog 'Yazici PRO v3.1.50 TEST yukseltmesi basliyor.'
      try {
        Get-CimInstance Win32_Process -Filter "Name='pythonw.exe'" -ErrorAction SilentlyContinue | Where-Object { [string]$_.CommandLine -like ('*' + $printerTarget + '*web_service.py*') } | ForEach-Object { Stop-Process -Id ([int]$_.ProcessId) -Force -ErrorAction SilentlyContinue }
      } catch {}
      $pt = Join-Path $env:TEMP ('KafePin-YaziciPRO-Update-' + [guid]::NewGuid().ToString('N'))
      New-Item -ItemType Directory -Force -Path $pt | Out-Null
      Expand-Archive -LiteralPath $printerZip -DestinationPath $pt -Force
      Get-ChildItem -LiteralPath $pt -Force | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $printerTarget -Recurse -Force }
      Remove-Item -LiteralPath $pt -Recurse -Force -ErrorAction SilentlyContinue
      try { & wevtutil.exe sl 'Microsoft-Windows-PrintService/Operational' /e:true | Out-Null } catch { Write-KafePinLog ('PrintService Operational acilamadi: ' + $_.Exception.Message) }
      Invoke-SilentCmd 'cmd.exe' '/c KURULUM.cmd /silent' $printerTarget
      Start-PrinterService $printerTarget
      Write-KafePinLog 'Yazici PRO v3.1.50 TEST yukseltildi ve baslatildi.'
    } catch {
      Write-KafePinLog ('Yazici PRO v3.1.50 TEST yukseltme hatasi: ' + $_.Exception.Message)
    }
  }

'''
          if 'v3.1.50 TEST yukseltmesi' not in dt:
