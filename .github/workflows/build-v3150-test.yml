          # ---- revenue.py: KafePin dogrudan satis + Downloads + Event 307 kuyrugu ----
          revenue = r'''from __future__ import annotations

import json
import subprocess
import threading
import time
import uuid
import urllib.request
from pathlib import Path

from config import DATA_DIR

STATE_PATH = DATA_DIR / "revenue-state.json"
KAFEPIN_DIRECT_URL = "http://127.0.0.1:3000/admin/product-sales/add-custom-direct"
PRINT_LOG = "Microsoft-Windows-PrintService/Operational"


def _load_state():
    try:
        data=json.loads(STATE_PATH.read_text(encoding="utf-8"))
        if isinstance(data,dict): return data
    except Exception: pass
    return {"last_record_id":0,"jobs":{},"sales":{}}


def _save_state(state):
    DATA_DIR.mkdir(parents=True,exist_ok=True)
    tmp=STATE_PATH.with_suffix('.tmp')
    tmp.write_text(json.dumps(state,ensure_ascii=False,indent=2),encoding='utf-8')
    tmp.replace(STATE_PATH)


def post_direct_sale(name, unit_price, quantity, payment_method, sale_id):
    state=_load_state()
    if state.get('sales',{}).get(sale_id,{}).get('status')=='sold':
        return state['sales'][sale_id]
    payload=json.dumps({
        'name':str(name), 'unitPrice':float(unit_price), 'quantity':int(quantity),
        'paymentMethod':'CARD' if str(payment_method).upper()=='CARD' else 'CASH'
    },ensure_ascii=False).encode('utf-8')
    req=urllib.request.Request(KAFEPIN_DIRECT_URL,data=payload,headers={'Content-Type':'application/json'},method='POST')
    with urllib.request.urlopen(req,timeout=6) as r:
        result=json.loads(r.read().decode('utf-8','replace') or '{}')
    if not result.get('ok'):
        raise RuntimeError(result.get('error') or 'KafePin doğrudan satış kabul etmedi.')
    state=_load_state(); state.setdefault('sales',{})[sale_id]={
        'status':'sold','time':time.time(),'name':name,'quantity':quantity,'unit_price':unit_price,
        'payment_method':payment_method,'total':result.get('total')
    }; _save_state(state)
    return state['sales'][sale_id]


def list_downloads():
    folder=Path.home()/'Downloads'
    exts={'.pdf','.jpg','.jpeg','.png','.bmp','.tif','.tiff','.webp','.doc','.docx'}
    rows=[]
    if not folder.exists(): return rows
    for p in folder.iterdir():
        try:
            if not p.is_file() or p.suffix.lower() not in exts: continue
            pages=None
            if p.suffix.lower()=='.pdf':
                try:
                    from pypdf import PdfReader
                    pages=len(PdfReader(str(p),strict=False).pages)
                except Exception: pass
            elif p.suffix.lower() in {'.jpg','.jpeg','.png','.bmp','.tif','.tiff','.webp'}: pages=1
            rows.append({'name':p.name,'size':p.stat().st_size,'mtime':p.stat().st_mtime,'pages':pages})
        except Exception: pass
    rows.sort(key=lambda x:x['mtime'],reverse=True)
    return rows[:100]


def resolve_download(name):
    folder=(Path.home()/'Downloads').resolve()
    p=(folder/str(name)).resolve()
    if p.parent != folder or not p.is_file(): raise ValueError('İndirilenler dosyası bulunamadı.')
    return p


def read_print_events(after_record_id=0):
    # Event 307 XML: Param2 belge, Param5 yazici, Param8 toplam sayfa.
    script=r'''$ErrorActionPreference='SilentlyContinue'; $events=Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-PrintService/Operational';Id=307} -MaxEvents 80; $out=@(); foreach($e in $events){ if($e.RecordId -le '''+str(int(after_record_id))+r'''){continue}; try{$x=[xml]$e.ToXml();$d=$x.Event.UserData.DocumentPrinted;$out += [pscustomobject]@{record_id=[int64]$e.RecordId;time=$e.TimeCreated.ToString('o');document=[string]$d.Param2;printer=[string]$d.Param5;pages=[int]$d.Param8}}catch{}}; $out | Sort-Object record_id | ConvertTo-Json -Compress'''
    cp=subprocess.run(['powershell.exe','-NoProfile','-Command',script],capture_output=True,text=True,encoding='utf-8',errors='replace',creationflags=getattr(subprocess,'CREATE_NO_WINDOW',0),timeout=12)
    if cp.returncode!=0 or not cp.stdout.strip(): return []
    try: data=json.loads(cp.stdout)
    except Exception: return []
    if isinstance(data,dict): data=[data]
    return data if isinstance(data,list) else []


class PrintRevenueQueue:
    def __init__(self):
        self.lock=threading.RLock(); self.stop=False
        threading.Thread(target=self._loop,daemon=True,name='KafePinPrintRevenue').start()

    def _loop(self):
        while not self.stop:
            try: self.poll()
            except Exception: pass
            time.sleep(4)

    def poll(self):
        with self.lock:
            state=_load_state(); last=int(state.get('last_record_id') or 0)
            events=read_print_events(last)
            for e in events:
                rid=str(e.get('record_id') or '')
                if not rid: continue
                state['last_record_id']=max(int(state.get('last_record_id') or 0),int(rid))
                doc=str(e.get('document') or '')
                # KafePin Yazici PRO kendi baskisini dogrudan kaydeder; watcher cift yazmaz.
                if doc.startswith('KafePinYaziciPRO|'):
                    continue
                state.setdefault('jobs',{}).setdefault(rid,{
                    'record_id':int(rid),'time':e.get('time'),'document':doc,
                    'printer':str(e.get('printer') or ''),'pages':max(1,int(e.get('pages') or 1)),
                    'status':'pending'
                })
            # Son 300 is tutulsun.
            jobs=state.get('jobs',{})
            if len(jobs)>300:
                keys=sorted(jobs,key=lambda k:int(k))[-300:]
                state['jobs']={k:jobs[k] for k in keys}
            _save_state(state)

    def list_jobs(self):
        self.poll(); state=_load_state()
        rows=list(state.get('jobs',{}).values())
        rows.sort(key=lambda x:int(x.get('record_id') or 0),reverse=True)
        return rows[:100]

    def close_job(self, record_id, service_type, prices, payment_method, free=False):
        with self.lock:
            state=_load_state(); key=str(record_id); job=state.get('jobs',{}).get(key)
            if not job: raise ValueError('Yazdırma işi bulunamadı.')
            if job.get('status')!='pending': return job
            pages=max(1,int(job.get('pages') or 1))
            labels={'bw':'Yazıcı Geliri - S/B Çıktı','color':'Yazıcı Geliri - Renkli Çıktı','identity':'Yazıcı Geliri - Kimlik Fotokopisi','photo':'Yazıcı Geliri - Fotoğraf Çıktısı'}
            price_keys={'bw':'price_bw','color':'price_color','identity':'price_identity','photo':'price_photo'}
            typ=service_type if service_type in labels else 'bw'
            if free:
                job.update({'status':'free','service_type':typ,'closed_at':time.time(),'total':0})
                _save_state(state); return job
            unit=float(prices.get(price_keys[typ]) or 0)
            if unit<=0: raise ValueError('Bu çıktı türü için geçerli fiyat gir.')
            sale_id='print-event-'+key
            sale=post_direct_sale(labels[typ],unit,pages,payment_method,sale_id)
            state=_load_state(); job=state.setdefault('jobs',{}).get(key,job)
            job.update({'status':'sold','service_type':typ,'closed_at':time.time(),'unit_price':unit,'total':unit*pages,'payment_method':payment_method,'sale_id':sale_id})
            state['jobs'][key]=job; _save_state(state); return job


queue=PrintRevenueQueue()
