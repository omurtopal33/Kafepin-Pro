name: BUILD v4.0.3 e-Devlet Candidate3

on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/v403-edevlet-candidate/**'
      - '.github/workflows/build-v403-edevlet-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct candidate builder
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir='dev/v403-edevlet-candidate'
          $parts=Get-ChildItem "$dir/build_v403_edevlet.part*" | Sort-Object Name
          if($parts.Count -ne 4){ throw "Expected 4 builder parts, found $($parts.Count)" }
          $out="$dir/build_v403_edevlet.py"
          $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
          $text=($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName) }) -join ''
          $text=$text.Replace([string][char]0x2019,'')
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE $out),$text,$utf8NoBom)
          python dev/v403-edevlet-candidate/patch_candidate2.py
          python dev/v403-edevlet-candidate/patch_candidate3_desktop.py
          python -m py_compile $out

      - name: Build v4.0.3 TEST candidate3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python dev/v403-edevlet-candidate/build_v403_edevlet.py

      - name: Final fast-update safety checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='KafePin-Pro-Update-v4.0.2.zip'
          $cand='KafePin-Pro-Update-v4.0.3-CANDIDATE3.zip'
          if(-not (Test-Path $cand)){throw 'candidate3 missing'}
          $td1=Join-Path $env:RUNNER_TEMP 'v402-final'; $td2=Join-Path $env:RUNNER_TEMP 'v403c3-final'
          Expand-Archive $base $td1 -Force; Expand-Archive $cand $td2 -Force
          $u=Get-Content (Join-Path $td2 'update.json') -Raw | ConvertFrom-Json
          $expected=@('KafePin_Update_Supervisor.js','pro-components/yazici-pro.zip','desktop-app/KafePinProDesktop.cs')
          $actual=@($u.files)
          if($actual.Count -ne 3 -or @($expected|Where-Object{$_ -notin $actual}).Count -ne 0){throw ('Targeted files list wrong: '+($actual -join ','))}
          $protected=@('server.js','KafePin_Desktop_App_Setup.ps1','KafePin_Desktop_Helper_Ensure.ps1','KafePin_Manager_Ensure.ps1','KafePin_Recovery.ps1','KafePin_System_Manager.ps1','desktop-app/desktop-app-version.json','pro-components/mp3-bot-pro.zip','pro-components/teknik-servis-pro.zip','pro-components/client-yonetim-pro.zip','pro-components/client-performans-pro.zip','pro-components/cv-olustur-pro.zip','services/spinService.js','utils/fee.js')
          foreach($rel in $protected){
            $a=Join-Path $td1 $rel; $b=Join-Path $td2 $rel
            if((Test-Path $a) -and (Test-Path $b)){
              if((Get-FileHash $a -Algorithm SHA256).Hash -ne (Get-FileHash $b -Algorithm SHA256).Hash){throw "Protected file changed: $rel"}
            }
          }
          $sup=Get-Content (Join-Path $td2 'KafePin_Update_Supervisor.js') -Raw
          if($sup -notmatch 'component-only activation: Yazici PRO repaired') { throw 'component-only supervisor path missing' }
          if($sup -notmatch "-Component','yazici-pro") { throw 'targeted Yazici repair missing' }
          node --check (Join-Path $td2 'KafePin_Update_Supervisor.js')
          node (Join-Path $td2 'KafePin_Update_Supervisor.js') --self-test
          $yz=Join-Path $env:RUNNER_TEMP 'v403c3-yazici'; Expand-Archive (Join-Path $td2 'pro-components/yazici-pro.zip') $yz -Force
          foreach($f in @('KafePin_YaziciPRO_ServiceHost.ps1','KafePin_YaziciPRO_WebView2.ps1')) {
            $e=$null; $t=$null; [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $yz $f),[ref]$t,[ref]$e)|Out-Null
            if($e.Count){ throw "PowerShell syntax failed: $f" }
          }
          $sup=Get-Content (Join-Path $td2 'KafePin_Update_Supervisor.js') -Raw
          if($sup -notmatch '17891/17893 health veya version'){throw 'Yazici health/version guard missing'}
          $desktop=Get-Content (Join-Path $td2 'desktop-app/KafePinProDesktop.cs') -Raw
          if($desktop -notmatch 'e-Devlet / Resmî Belgeler'){ throw 'main desktop e-Devlet tab missing' }
          if($desktop -notmatch 'NewWindowRequested'){ throw 'desktop popup guard missing' }
          if($desktop -notmatch 'WebView2Profile-eDevlet'){ throw 'separate e-Devlet session profile missing' }
          if($desktop -notmatch 'ClearEdevletSessionAsync'){ throw 'e-Devlet session cleanup missing' }
          if($desktop -notmatch '17891'){ throw 'desktop 17891 path missing' }
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $sdkRoot=Join-Path $td2 'desktop-app/sdk/1.0.4129.50'
          $desktopExe=Join-Path $env:RUNNER_TEMP 'KafePinProDesktop-edevlet-test.exe'
          $cscArgs=@('/nologo','/target:winexe','/platform:x64','/optimize+','/utf8output',('/out:'+ $desktopExe),'/reference:System.dll','/reference:System.Core.dll','/reference:System.Drawing.dll','/reference:System.Windows.Forms.dll',('/reference:'+ (Join-Path $sdkRoot 'Microsoft.Web.WebView2.Core.dll')),('/reference:'+ (Join-Path $sdkRoot 'Microsoft.Web.WebView2.WinForms.dll')),(Join-Path $td2 'desktop-app/KafePinProDesktop.cs'))
          & $csc @cscArgs
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $desktopExe)){ throw 'main desktop e-Devlet source compile failed' }
          Write-Host 'CANDIDATE3_TARGETED_DESKTOP_EDEVLET_OK'

      - uses: actions/upload-artifact@v4
        with:
          name: KafePin-Pro-v4.0.3-EDEVLET-CANDIDATE3
          path: |
            KafePin-Pro-Update-v4.0.3-CANDIDATE3.zip
            KafePin-Pro-Update-v4.0.3-CANDIDATE3.sha256.txt
            V4.0.3-EDEVLET-CANDIDATE-TEST-REPORT.md
          if-no-files-found: error
          retention-days: 30
