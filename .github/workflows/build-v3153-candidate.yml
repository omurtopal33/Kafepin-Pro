name: Validate v3.1.53 Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/v3153-candidate/**'
      - '.github/workflows/build-v3153-candidate.yml'
      - 'README.md'
      - 'KafePin-Pro-Update-v3.1.53.zip'
      - 'KafePin-Pro-Update-v3.1.53.sha256.txt'
      - 'V3.1.53-CANDIDATE-TEST-REPORT.md'
      - 'latest.json'

permissions:
  contents: write

jobs:
  validate-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and validate v3.1.53
        shell: pwsh
        run: |
          python dev/v3153-candidate/build_v3153.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'kp3153-parse'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -LiteralPath 'KafePin-Pro-Update-v3.1.53.zip' -DestinationPath $tmp
          $files = @(
            (Join-Path $tmp 'KafePin_Manager_Ensure.ps1'),
            (Join-Path $tmp 'v3153-yazici-payload\KafePin_YaziciPRO_WebView2.ps1'),
            (Join-Path $tmp 'v3153-yazici-payload\KafePin_AI_Ayarla.ps1')
          )
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("$f :: " + $_.Message) }
              throw "PowerShell parser failed: $f"
            }
          }

      - name: Commit tested candidate outputs
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f -- 'KafePin-Pro-Update-v3.1.51.zip' 'KafePin-Pro-Update-v3.1.51.sha256.txt' 'KafePin-Pro-Update-v3.1.52.zip' 'KafePin-Pro-Update-v3.1.52.sha256.txt' 'V3.1.51-CANDIDATE-TEST-REPORT.md' 'V3.1.52-CANDIDATE-TEST-REPORT.md' 'latest-candidate.json' 'latest-test.json'
          git rm -r -f -- 'dev/v3151-candidate' '.github/workflows/build-v3151-candidate.yml'
          git add -- 'KafePin-Pro-Update-v3.1.53.zip' 'KafePin-Pro-Update-v3.1.53.sha256.txt' 'V3.1.53-CANDIDATE-TEST-REPORT.md' 'latest.json'
          $names = @(git diff --cached --name-only)
          $allowed = @('KafePin-Pro-Update-v3.1.53.zip','KafePin-Pro-Update-v3.1.53.sha256.txt','V3.1.53-CANDIDATE-TEST-REPORT.md','latest.json','KafePin-Pro-Update-v3.1.51.zip','KafePin-Pro-Update-v3.1.51.sha256.txt','KafePin-Pro-Update-v3.1.52.zip','KafePin-Pro-Update-v3.1.52.sha256.txt','V3.1.51-CANDIDATE-TEST-REPORT.md','V3.1.52-CANDIDATE-TEST-REPORT.md','latest-candidate.json','latest-test.json','.github/workflows/build-v3151-candidate.yml')
          foreach ($n in $names) { if (($allowed -notcontains $n) -and (-not $n.StartsWith('dev/v3151-candidate/'))) { throw ('Unexpected candidate output: ' + $n) } }
          if ($names.Count -eq 0) { Write-Host 'Candidate outputs already identical'; exit 0 }
          if ($names.Count -lt 8) { throw 'Candidate output/cleanup set incomplete' }
          git commit -m 'candidate: publish v3.1.53 and remove superseded updates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
