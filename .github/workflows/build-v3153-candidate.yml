name: Validate v3.1.53 Candidate3

on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/v3153-candidate/**'
      - '.github/workflows/build-v3153-candidate.yml'
      - 'KafePin-Pro-Update-v3.1.53.zip'
      - 'KafePin-Pro-Update-v3.1.53.sha256.txt'
      - 'V3.1.53-CANDIDATE-TEST-REPORT.md'
      - 'latest.json'

permissions:
  contents: write

jobs:
  validate-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply candidate3 fix to existing v3.1.53
        shell: pwsh
        run: |
          python dev/v3153-candidate/patch_candidate3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate candidate3 package
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'kp3153-c3'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -LiteralPath 'KafePin-Pro-Update-v3.1.53.zip' -DestinationPath $tmp
          $u = Get-Content (Join-Path $tmp 'update.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($u.version -ne '3.1.53' -or $u.baseVersion -ne '3.1.49' -or -not $u.cumulative) { throw 'update.json version/base/cumulative invalid' }
          $mgr = Get-Content (Join-Path $tmp 'KafePin_Manager_Ensure.ps1') -Raw -Encoding UTF8
          foreach ($bad in @('Wait-YaziciWeb','Wait-YaziciRevenue','Stop-YaziciRuntime')) { if ($mgr.Contains($bad)) { throw ('Updater timeout risk remains: ' + $bad) } }
          if (-not $mgr.Contains("updaterWait='none'")) { throw 'candidate3 updater marker missing' }
          $server = Get-Content (Join-Path $tmp 'server.js') -Raw -Encoding UTF8
          if (-not $server.Contains('timeout: 35000')) { throw 'Core updater timeout changed unexpectedly' }
          if (-not $server.Contains('sqlite3.OPEN_READONLY')) { throw 'EveryCafe read-only marker missing' }
          node --check (Join-Path $tmp 'server.js')
          node --check (Join-Path $tmp 'v3153-yazici-payload\KafePin_YaziciGelir_Service.js')
          node --check (Join-Path $tmp 'v3153-yazici-payload\v3153-ai.js')
          python -m py_compile (Join-Path $tmp 'v3153-yazici-payload\web_service.py')
          $web = Get-Content (Join-Path $tmp 'v3153-yazici-payload\web_service.py') -Raw -Encoding UTF8
          if (-not $web.Contains('3.1.53-candidate3') -or -not $web.Contains('Word.Application')) { throw 'candidate3 backend/Word COM missing' }
          $start = Get-Content (Join-Path $tmp 'v3153-yazici-payload\START_YAZICI_PRO.cmd') -Raw -Encoding UTF8
          if (-not $start.Contains('3.1.53-candidate3') -or -not $start.Contains('KafePinYaziciPRO')) { throw 'candidate3 runtime restart/health missing' }
          $wv = Get-Content (Join-Path $tmp 'v3153-yazici-payload\KafePin_YaziciPRO_WebView2.ps1') -Raw -Encoding UTF8
          if (-not $wv.Contains('web.whatsapp.com') -or -not $wv.Contains('RuntimeBootstrapperUrl')) { throw 'WhatsApp/WebView2 runtime logic missing' }

      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'kp3153-c3'
          $files = @(
            (Join-Path $tmp 'KafePin_Manager_Ensure.ps1'),
            (Join-Path $tmp 'v3153-yazici-payload\KafePin_YaziciPRO_WebView2.ps1'),
            (Join-Path $tmp 'v3153-yazici-payload\KafePin_AI_Ayarla.ps1')
          )
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("$f :: " + $_.Message) }
              throw "PowerShell parser failed: $f"
            }
          }

      - name: Commit tested candidate3 outputs
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'KafePin-Pro-Update-v3.1.53.zip' 'KafePin-Pro-Update-v3.1.53.sha256.txt' 'V3.1.53-CANDIDATE-TEST-REPORT.md' 'latest.json'
          $names = @(git diff --cached --name-only)
          if ($names.Count -eq 0) { Write-Host 'Candidate3 outputs already identical'; exit 0 }
          foreach ($n in $names) { if (@('KafePin-Pro-Update-v3.1.53.zip','KafePin-Pro-Update-v3.1.53.sha256.txt','V3.1.53-CANDIDATE-TEST-REPORT.md','latest.json') -notcontains $n) { throw ('Unexpected output: ' + $n) } }
          git commit -m 'candidate3: publish timeout-safe v3.1.53 [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
