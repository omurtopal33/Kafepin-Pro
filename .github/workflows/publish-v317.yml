name: KafePin Pro v3.1.17 kapsam kilitli yayin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v317.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: v3.1.16 ustune sadece 3 degisikligi uygula
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          rm -rf build v317.patch.gz v317.patch
          mkdir build
          unzip -q KafePin-Pro-Update-v3.1.16.zip -d build
          printf '%s' "$PATCH_B64" | base64 -d > v317.patch.gz
          gzip -dc v317.patch.gz > v317.patch
          patch -p1 -d build < v317.patch

          python3 - <<'PY'
          from pathlib import Path
          import json
          notes=(
            "v3.1.17: Yalnız üç değişiklik. (1) Hızlı Git satırında Bakım Modu yanında tek Bildirimler düğmesi. "
            "(2) Yalnız 5 acil bildirim: Kasa/Gelir Uyuşmazlığı, Bekleyen Ödeme, Kart Banka Yatırımı Doğrulama, EveryCafe Entegrasyon Sorunu ve Kritik Sistem Sağlığı; bildirim varsa düğme kırmızı yanıp söner. "
            "(3) Yönetim Merkezi kurulu sürümü yerel /api/health üzerinden hemen okur; uzak kontrol başarısız olsa bile 'Sürüm okunuyor...' yazısında kalmaz. "
            "v3.1.16 server.js, DB/yedek/geri yükleme, restart, EveryCafe, Telegram, muhasebe, masa/çark ve gelir hesapları değiştirilmedi."
          )
          version={"version":"3.1.17","name":"KafePin Pro","channel":"stable","updatedAt":"2026-08-17","notes":notes}
          update={"version":"3.1.17","files":["public/admin.html","public/kafepin-pro-yonetim.html","kafepin-pro-version.json","update.json"],"notes":notes}
          Path('build/kafepin-pro-version.json').write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('build/update.json').write_text(json.dumps(update,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          echo '7ba5443d28e3b046f26c9473301ebd8f3d6575122c79204eabdc69254a07fbc6  build/public/admin.html' | sha256sum -c -
          echo '7022e884a37c654ae06e02973fa84a2defe6dfd589ffbffdedc327769dd2fa30  build/public/kafepin-pro-yonetim.html' | sha256sum -c -
          echo '223c67b3890e69041793fb77c1122d97a6dde295ace72b791122c700d4c1ce09  build/kafepin-pro-version.json' | sha256sum -c -
          echo '801b24608087357d01890327e9adb8ec6ad8f4a4eb330b9cfe81b72c1e52d01d  build/update.json' | sha256sum -c -

          rm -f KafePin-Pro-Update-v3.1.17.zip
          (cd build && zip -9 -q ../KafePin-Pro-Update-v3.1.17.zip public/admin.html public/kafepin-pro-yonetim.html kafepin-pro-version.json update.json)
          unzip -t KafePin-Pro-Update-v3.1.17.zip
          test "$(unzip -Z1 KafePin-Pro-Update-v3.1.17.zip | wc -l)" = "4"
          sha256sum KafePin-Pro-Update-v3.1.17.zip

      - name: Yayina al ve tek seferlik workflowu sil
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KafePin Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add KafePin-Pro-Update-v3.1.17.zip
          git rm .github/workflows/publish-v317.yml
          git commit -m 'KafePin: v3.1.17 yalniz 3 kapsamli degisiklik'
          git push
