name: KafePin Pro v3.1.21 STABLE kilitle

on:
  push:
    paths:
      - '.github/workflows/publish-v321-lock.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: v3.1.21 kümülatif paketi doğrula ve oluştur
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          rm -rf build v321.patch.gz v321.patch
          mkdir build
          unzip -q KafePin-Pro-Update-v3.1.18.zip -d build
          printf '%s' "$PATCH_B64" | base64 -d > v321.patch.gz
          gzip -dc v321.patch.gz > v321.patch
          patch -p1 -d build < v321.patch

          echo '3c22f750ced189c1cf7f13052ab8489845321ba1782a41b8972d6088995d522a  build/server.js' | sha256sum -c -
          echo 'f9bce89a4a4d924f19b1307cddd5010a0dcae8c31fad5db89d1dd08174d0ee18  build/KafePin_System_Manager.ps1' | sha256sum -c -
          echo 'd5901f8ec0ba6bcc73ce4401c6d243610d135c64c0893025497254775f1cdccb  build/KafePin_Manager_Ensure.ps1' | sha256sum -c -
          echo '7ba5443d28e3b046f26c9473301ebd8f3d6575122c79204eabdc69254a07fbc6  build/public/admin.html' | sha256sum -c -
          echo '5c755fd6f3e174ce230eb2c81db6c5fdf615c45e5c3ac11911adf8d27f336e25  build/public/kafepin-pro-yonetim.html' | sha256sum -c -
          echo 'b52acf85ada4ccd1407f139fe29c83001997eae99dfaec75f51a7885be19b30d  build/kafepin-pro-version.json' | sha256sum -c -
          echo 'ab573c0af50a415ff78850880d41e5e39e176ae5b03c8d8c827256c486524516  build/update.json' | sha256sum -c -

          rm -f KafePin-Pro-Update-v3.1.21.zip
          (
            cd build
            zip -9 -q ../KafePin-Pro-Update-v3.1.21.zip \
              server.js \
              KafePin_System_Manager.ps1 \
              KafePin_Manager_Ensure.ps1 \
              public/admin.html \
              public/kafepin-pro-yonetim.html \
              kafepin-pro-version.json \
              update.json
          )
          unzip -t KafePin-Pro-Update-v3.1.21.zip
          test "$(unzip -Z1 KafePin-Pro-Update-v3.1.21.zip | wc -l)" = "7"

          python3 - <<'PY'
          import hashlib, json, pathlib
          from datetime import datetime
          from zoneinfo import ZoneInfo

          zip_path = pathlib.Path('KafePin-Pro-Update-v3.1.21.zip')
          sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          update = json.loads(pathlib.Path('build/update.json').read_text(encoding='utf-8-sig'))
          notes = (
              "v3.1.21 STABLE KİLİT: Gerçek Windows kurulumunda restart zinciri kullanıcı tarafından "
              "başarıyla doğrulandı. " + str(update.get('notes') or '')
          )
          latest = {
              "version": "3.1.21",
              "publishedAt": datetime.now(ZoneInfo('Europe/Istanbul')).isoformat(timespec='seconds'),
              "notes": notes,
              "downloadUrl": "https://raw.githubusercontent.com/omurtopal33/Kafepin-Pro/main/KafePin-Pro-Update-v3.1.21.zip",
              "sha256": sha
          }
          pathlib.Path('latest.json').write_text(
              json.dumps(latest, ensure_ascii=False, indent=2) + "\n",
              encoding='utf-8'
          )
          print('GitHub ZIP SHA256:', sha)
          PY

      - name: v3.1.21 STABLE olarak kilitle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KafePin Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add KafePin-Pro-Update-v3.1.21.zip latest.json
          git rm -f KafePin-Pro-Update-v3.1.17.zip KafePin-Pro-Update-v3.1.18.zip
          git rm .github/workflows/publish-v321-lock.yml
          git commit -m 'KafePin: v3.1.21 STABLE kilit'
          git push
