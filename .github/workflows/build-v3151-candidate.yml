name: Build v3.1.51 Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v3151-candidate.yml'

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and run full candidate tests
        shell: pwsh
        run: |
          python dev/v3151-candidate/build_v3151.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create candidate feed and SHA file
        shell: pwsh
        run: |
          $zip = 'KafePin-Pro-Update-v3.1.51.zip'
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'KafePin-Pro-Update-v3.1.51.sha256.txt' -Value ($sha + '  ' + $zip) -Encoding ASCII
          $feed = [ordered]@{
            channel = 'candidate'
            stableVersion = '3.1.49'
            version = '3.1.51'
            available = $true
            baseVersion = '3.1.49'
            cumulative = $false
            downloadUrl = 'https://raw.githubusercontent.com/omurtopal33/Kafepin-Pro/main/KafePin-Pro-Update-v3.1.51.zip'
            sha256 = $sha
            notes = 'v3.1.51 ADAY: v3.1.49 STABLE üzerine Yazıcı PRO + Telegram tekilleştirme. Kullanıcı sahada onaylayıp kitle demeden STABLE değildir.'
          }
          $feed | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'latest-candidate.json' -Encoding UTF8
          Write-Host "CANDIDATE_SHA256=$sha"

      - name: Guard stable metadata
        shell: pwsh
        run: |
          $latest = Get-Content -LiteralPath 'latest.json' -Raw | ConvertFrom-Json
          if ([string]$latest.version -ne '3.1.49') { throw ('latest.json stable changed unexpectedly: ' + [string]$latest.version) }
          if (Test-Path -LiteralPath 'latest-test.json') {
            $test = Get-Content -LiteralPath 'latest-test.json' -Raw | ConvertFrom-Json
            if ([string]$test.stableVersion -ne '3.1.49') { throw 'latest-test stableVersion changed unexpectedly' }
          }

      - name: Publish candidate files only
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'KafePin-Pro-Update-v3.1.51.zip' 'KafePin-Pro-Update-v3.1.51.sha256.txt' 'V3.1.51-CANDIDATE-TEST-REPORT.md' 'latest-candidate.json'
          git diff --cached --name-only
          $names = @(git diff --cached --name-only)
          $allowed = @('KafePin-Pro-Update-v3.1.51.zip','KafePin-Pro-Update-v3.1.51.sha256.txt','V3.1.51-CANDIDATE-TEST-REPORT.md','latest-candidate.json')
          foreach ($n in $names) { if ($allowed -notcontains $n) { throw ('Unexpected publish file: ' + $n) } }
          if ($names.Count -lt 4) { throw 'Candidate publish files incomplete' }
          git commit -m 'candidate: publish tested v3.1.51 without stable promotion'
          git push origin HEAD:main
