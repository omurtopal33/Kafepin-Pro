name: Publish KafePin v3.1.45 FINAL STABLE

on:
  push:
    paths:
      - '.github/workflows/publish-v3.1.45.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v3.1.45 from tested v3.1.44
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _kp3145
          mkdir _kp3145
          unzip -q KafePin-Pro-Update-v3.1.44.zip -d _kp3145
          cd _kp3145
          patch -p1 < ../.github/v3.1.45-html.patch

          python3 - <<'PY'
          from pathlib import Path
          import json

          notes = "v3.1.45 FINAL STABLE — SÜRÜM NOTLARI TAMAMLAMA: Sahada/testte kullanılan v3.1.44 EveryCafe oturum-otoritesi davranışı ve v3.1.43 güvenilirlik altyapısı aynen korunarak v3.1.45 kilitli FINAL STABLE olarak hazırlanmıştır. Yönetim panelindeki KafePin Pro Sürüm Notları ekranında v3.1.39–v3.1.45 arasındaki eksik ayrıntılı sürüm kartları tamamlandı. Gelecekte statik bir sürüm kartı unutulursa, kurulu sürüm için oluşturulan geçici kart update-status/latest notes bilgisi sonradan geldiğinde gerçek notla otomatik güncellenir; 'Bu sürüm için ayrıntılı not kaydı pakete eklenmemiş' mesajı gerçek notes mevcutken kalıcı kalmaz. Bu sürümde server.js ana oturum/finans/20:00/çark işleyişine, EveryCafe masa otoritesine, 45 dakika çark yaşam döngüsüne ve Monitor/Admin tema-yerleşimine müdahale edilmemiştir. EveryCafe veritabanı yalnız sqlite3.OPEN_READONLY ile okunur ve EveryCafe'ye yazma yapılmaz. Paket kümülatiftir; v3.1.29 STABLE tabanı üzerine ara sürümler tek tek kurulmadan doğrudan v3.1.45 uygulanabilir."

          vp = Path('kafepin-pro-version.json')
          v = json.loads(vp.read_text(encoding='utf-8-sig'))
          v['version'] = '3.1.45'
          v['channel'] = 'stable'
          v['updatedAt'] = '2026-08-19'
          v['notes'] = notes
          vp.write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          up = Path('update.json')
          u = json.loads(up.read_text(encoding='utf-8-sig'))
          u['version'] = '3.1.45'
          u['notes'] = notes
          up.write_text(json.dumps(u, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate core invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check _kp3145/server.js
          node --check _kp3145/services/spinService.js
          node --check _kp3145/utils/fee.js

          python3 - <<'PY'
          from pathlib import Path
          import re, json, subprocess

          root=Path('_kp3145')
          html=(root/'public/kafepin-pro-yonetim.html').read_text(encoding='utf-8')
          for ver in ['3.1.39','3.1.40','3.1.41','3.1.42','3.1.43','3.1.44','3.1.45']:
              assert html.count(f'data-version="{ver}"') == 1, ver
          assert "dataset.generatedRelease='1'" in html
          assert "else if(note && item.dataset.generatedRelease==='1')" in html

          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)
          for i,b in enumerate(blocks):
              if not b.strip():
                  continue
              p=Path(f'/tmp/kp315-html-{i}.js')
              p.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)

          server=(root/'server.js').read_text(encoding='utf-8')
          opens=list(re.finditer(r'new\s+sqlite3\.Database\s*\(\s*EVERYCAFE_DB_PATH\s*,([^\)]*)\)',server,re.S))
          assert len(opens) == 11, len(opens)
          assert all('sqlite3.OPEN_READONLY' in m.group(0) for m in opens)
          assert not re.search(r'\bsource\.(?:run|exec)\s*\(',server,re.I)
          assert re.search(r'SPIN_SURE_DK\s*=\s*45\b',server)
          assert 'const SPIN_WAIT_MS = 45 * 60 * 1000;' in server
          assert 'function getSpinReadyAt' in server

          v=json.loads((root/'kafepin-pro-version.json').read_text(encoding='utf-8'))
          u=json.loads((root/'update.json').read_text(encoding='utf-8'))
          assert v['version'] == u['version'] == '3.1.45'
          assert v['channel'] == 'stable'
          assert v['notes'] == u['notes']
          print('OK: 11/11 EveryCafe OPEN_READONLY, spin 45 dk, release cards and JS syntax')
          PY

          for f in server.js public/monitor.html public/admin.html public/everycafe-reconcile.html services/spinService.js utils/fee.js KafePin_System_Manager.ps1 KafePin_Manager_Ensure.ps1 KafePin_Desktop_Action.ps1 KafePin_Desktop_Helper_Ensure.ps1; do
            unzip -p KafePin-Pro-Update-v3.1.44.zip "$f" > "/tmp/base-$(basename "$f")"
            cmp -s "/tmp/base-$(basename "$f")" "_kp3145/$f" || { echo "Core file changed unexpectedly: $f"; exit 1; }
          done

      - name: Package and publish metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f KafePin-Pro-Update-v3.1.45.zip
          (cd _kp3145 && zip -qr ../KafePin-Pro-Update-v3.1.45.zip .)
          unzip -t KafePin-Pro-Update-v3.1.45.zip >/dev/null
          SHA="$(sha256sum KafePin-Pro-Update-v3.1.45.zip | awk '{print $1}')"
          export SHA

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, os

          notes = "v3.1.45 FINAL STABLE — SÜRÜM NOTLARI TAMAMLAMA: Sahada/testte kullanılan v3.1.44 EveryCafe oturum-otoritesi davranışı ve v3.1.43 güvenilirlik altyapısı aynen korunarak v3.1.45 kilitli FINAL STABLE olarak hazırlanmıştır. Yönetim panelindeki KafePin Pro Sürüm Notları ekranında v3.1.39–v3.1.45 arasındaki eksik ayrıntılı sürüm kartları tamamlandı. Gelecekte statik bir sürüm kartı unutulursa, kurulu sürüm için oluşturulan geçici kart update-status/latest notes bilgisi sonradan geldiğinde gerçek notla otomatik güncellenir; 'Bu sürüm için ayrıntılı not kaydı pakete eklenmemiş' mesajı gerçek notes mevcutken kalıcı kalmaz. Bu sürümde server.js ana oturum/finans/20:00/çark işleyişine, EveryCafe masa otoritesine, 45 dakika çark yaşam döngüsüne ve Monitor/Admin tema-yerleşimine müdahale edilmemiştir. EveryCafe veritabanı yalnız sqlite3.OPEN_READONLY ile okunur ve EveryCafe'ye yazma yapılmaz. Paket kümülatiftir; v3.1.29 STABLE tabanı üzerine ara sürümler tek tek kurulmadan doğrudan v3.1.45 uygulanabilir."
          latest={
            'version':'3.1.45',
            'publishedAt':datetime.now(ZoneInfo('Europe/Istanbul')).isoformat(timespec='seconds'),
            'notes':notes,
            'downloadUrl':'https://raw.githubusercontent.com/omurtopal33/Kafepin-Pro/main/KafePin-Pro-Update-v3.1.45.zip',
            'sha256':os.environ['SHA']
          }
          Path('latest.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          readme='''# KafePin Pro Update Center

Bu depo KafePin Pro guncelleme paketleri icindir.

## KILITLI / STABLE DURUM

- **v3.1.29 = STABLE FULL BASE.** Yeni kafe kurulumu ve tum kumulatif guncellemelerin guvenli tabanidir.
- **v3.1.45 = FINAL STABLE.** Sahada test edilen v3.1.44 EveryCafe oturum-otoritesi davranisini, v3.1.43 guvenilirlik/20:00/backup/saglik altyapisini ve ayrintili Surum Notlari duzeltmesini kapsayan guncel kilitli surumdur.
- v3.1.45 kumulatiftir; v3.1.29 uzerine dogrudan kurulabilir. Ara surumleri kurmak gerekmez.
- v3.1.43 onceki kilitli stable referans, v3.1.44 ise v3.1.45'e temel olan test surumudur; eski paketler yerinde degistirilmez.
- Depoda dagitim paketi olarak yalniz v3.1.29 tabani ve v3.1.45 guncel FINAL STABLE paket tutulur.

## Guncelleme guvenligi

- Kafe veritabani, token, IP, Telegram bilgisi ve yedek kesinlikle yuklenmez.
- `latest.json` aktif FINAL STABLE surumu bildirir ve su anda v3.1.45'i gosterir.
- EveryCafe veritabani salt okunur kullanilir; tum EveryCafe DB acilislari `sqlite3.OPEN_READONLY` olmalidir ve EveryCafe'ye yazma yapilmaz.
- Ciro kaynagi: EveryCafe gercek gelir + KafePin dogrudan satis. Cark maliyeti genel cirodan dusulmez; ayri maliyet olarak izlenir.
- Cark 45 dakika: yeni musteri cark sayfasini ilk kez acmadan sayac baslamaz; ilk gercek acilista 45:00 baslar, pencere kapansa da gercek zaman ilerler, spin sonrasi yeniden 45:00 olur.
- Isletme gunu siniri 20:00'dir; 20:00 sonrasi gelir yeni isletme gunune aittir. Devreden masa varsa devir geliri ayrica belirtilir ve ikinci kez ciroya eklenmez.
- Calisan `server.js` ana mantigi ve Monitor/Admin tema-yapisi onaysiz degistirilmez. Degisiklik once konusulur ve kullanici onayindan sonra hedefli uygulanir.
- Her yeni surumde ayrintili surum notu zorunludur ve Surum Notlari ekraninda gorunurlugu paket testinde dogrulanir.
- Bundan sonraki degisiklikler v3.1.45 yerinde degistirilmeden yeni kumulatif surum numarasi ile (v3.1.46+) devam eder.
'''
          Path('README.md').write_text(readme,encoding='utf-8')
          PY

          echo "Published SHA256: $SHA"

      - name: Commit FINAL STABLE and clean old distribution zips
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _kp3145
          git rm -f --ignore-unmatch KafePin-Pro-Update-v3.1.43.zip KafePin-Pro-Update-v3.1.44.zip
          git rm -f --ignore-unmatch .github/v3.1.45-html.patch .github/workflows/publish-v3.1.45.yml
          git add KafePin-Pro-Update-v3.1.45.zip latest.json README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: lock v3.1.45 FINAL STABLE"
          git push
